flashsale:
  # Admission strategy: "sql" (baseline, benchmark reference) or "redis" (optimised).
  gate: sql
  kafka:
    reservations-topic: sale.reservations
    dlt-topic: sale.reservations.DLT
    partitions: 6
  outbox:
    batch-size: 50
    poll-ms: 200
    enabled: true
  payment:
    latency-ms: 20
    failure-rate: 0
  reconciler:
    enabled: true
    poll-ms: 1000
    batch-size: 100
  security:
    enabled: true
    # Local/dev only. Override with JWT_SECRET; never commit a production key.
    jwt-secret: ${JWT_SECRET:local-dev-only-hs256-secret-32b!!}
  rate-limit:
    enabled: true
    user-per-second: 10
    global-per-second: 20000

spring:
  application:
    name: flash-sale-platform
  threads:
    virtual:
      enabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: flash-sale-order-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      # Ack after the listener method returns; fulfilment commits first.
      ack-mode: record
      concurrency: 3

  docker:
    compose:
      lifecycle-management: start_only
      file: compose.yaml

server:
  # 8085 keeps clear of a locally installed Pulsar admin on 8080.
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
