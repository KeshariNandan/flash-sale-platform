spring:
  application:
    name: flash-sale-platform

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    consumer:
      group-id: flash-sale-order-worker
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual_immediate

  docker:
    compose:
      lifecycle-management: start_only
      file: compose.yaml

server:
  # 8085 keeps clear of a locally installed Pulsar admin on 8080.
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
